<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset PAMAC Password</title><link rel="stylesheet" href="css/style.css"><style>body{font-family:Arial,sans-serif;background:#f5f2fa;margin:0;color:#251532}.wrap{max-width:520px;margin:50px auto;padding:20px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 15px #0001}.card input{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:8px}.btn{background:#159447;color:white;border:0;padding:13px 18px;border-radius:8px;font-size:15px}.msg{overflow-wrap:anywhere;color:#54218a;font-weight:bold}</style></head>
<body><main class="wrap"><section class="card"><h1>PAMAC Password Reset</h1><p>Enter a new password for your administrator account.</p><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Repeat your new password"><button class="btn" id="saveBtn" onclick="saveNewPassword()">Save New Password</button><p id="message" class="msg">Open this page using the latest password-reset email link.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
let recoveryReady=false;
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY" || session){recoveryReady=true;document.getElementById("message").textContent="Recovery link accepted. Choose your new password.";}});
(async()=>{const {data,error}=await supabaseClient.auth.getSession();if(data.session){recoveryReady=true;document.getElementById("message").textContent="Recovery session found. Choose your new password.";}else if(error){document.getElementById("message").textContent=error.message;}})();
async function saveNewPassword(){const p=document.getElementById("newPassword").value;const c=document.getElementById("confirmPassword").value;const m=document.getElementById("message");if(p.length<8){m.textContent="Use at least 8 characters.";return;}if(p!==c){m.textContent="The passwords do not match.";return;}m.textContent="Updating password...";const {error}=await supabaseClient.auth.updateUser({password:p});if(error){m.textContent="Could not update password: "+error.message;return;}m.textContent="Password updated successfully. You can now sign in to PAMAC Admin.";document.getElementById("saveBtn").disabled=true;setTimeout(()=>location.href="admin/index.html",1800);}
</script></body></html>
